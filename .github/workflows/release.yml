name: Build & Release APK

on:
  push:
    branches:
      - master
      - release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x frontend/gradlew

      - name: Build Debug APK
        run: cd frontend && ./gradlew assembleDebug

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: frontend/app/build/outputs/apk/debug/app-debug.apk
          name: Auto-Build (${{ github.ref_name }})
          tag_name: build-${{ github.sha }}
          body: "Automated build from branch ${{ github.ref_name }} (commit ${{ github.sha }})."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
